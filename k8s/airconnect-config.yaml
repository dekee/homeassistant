apiVersion: v1
kind: ConfigMap
metadata:
  name: airconnect-config
  namespace: homeassistant
data:
  aircast.xml: |
    <?xml version="1.0"?>
    <aircast>
    <common>
    <enabled>1</enabled>
    <stop_receiver>0</stop_receiver>
    <media_volume>0.5000</media_volume>
    <latency></latency>
    <drift>0</drift>
    <codec>flac</codec>
    <metadata>1</metadata>
    <flush>1</flush>
    <artwork></artwork>
    </common>
    <main_log>info</main_log>
    <cast_log>info</cast_log>
    <util_log>warn</util_log>
    <log_limit>-1</log_limit>
    <max_players>32</max_players>
    <ports>0:0</ports>
    <binding>?</binding>
    </aircast>
  airupnp.xml: |
    <?xml version="1.0"?>
    <airupnp>
    <common>
    <enabled>1</enabled>
    <max_volume>100</max_volume>
    <http_length>-1</http_length>
    <upnp_max>1</upnp_max>
    <codec>flac</codec>
    <metadata>1</metadata>
    <flush>1</flush>
    <artwork></artwork>
    <latency>-500</latency>
    <drift>0</drift>
    </common>
    <main_log>info</main_log>
    <upnp_log>info</upnp_log>
    <util_log>warn</util_log>
    <raop_log>info</raop_log>
    <log_limit>-1</log_limit>
    <max_players>32</max_players>
    <binding>?</binding>
    <ports>0:0</ports>
    </airupnp>
