apiVersion: apps/v1
kind: Deployment
metadata:
  name: airconnect
  namespace: homeassistant
  labels:
    app: airconnect
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: airconnect
  template:
    metadata:
      labels:
        app: airconnect
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: k8s-cp
      containers:
        - name: airconnect
          image: 1activegeek/airconnect:latest
          env:
            - name: TZ
              value: "America/Los_Angeles"
            - name: AIRCAST_VAR
              value: "-x /config/aircast.xml"
            - name: AIRUPNP_VAR
              value: "-x /config/airupnp.xml"
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: airconnect-config
